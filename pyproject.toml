[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filingsaudit"
version = "0.1.0"
description = "Auditable financial agents: SEC EDGAR data over MCP, metric computation with lineage, and a risk agent whose signed approval is required before any report is released."
requires-python = ">=3.12"
dependencies = [
    "agentmesh",
    "cryptography>=42",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
filingsaudit = "filingsaudit.cli:main"

[tool.uv.sources]
agentmesh = { path = "../agent-mesh-core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/filingsaudit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
